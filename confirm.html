<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buchung bestätigen · Core Cruises</title><link rel="stylesheet" href="booking.css"></head><body><main class="card"><p class="eyebrow">CORE CRUISES</p><h1>Angaben prüfen und Buchung beauftragen</h1><div id="details" class="muted">Der Vorgang wird geladen …</div><p>Mit der Bestätigung beauftragst du Core Cruises, die Buchung bei der Reederei anzulegen. Preise und Verfügbarkeiten können sich bis dahin ändern.</p><button id="confirm" class="primary" disabled>Angaben bestätigen und Buchung beauftragen</button><p id="message" class="message" role="alert"></p></main><script>const API='https://api.corecruises.info/v1',token=new URLSearchParams(location.search).get('token'),details=document.querySelector('#details'),button=document.querySelector('#confirm'),message=document.querySelector('#message');if(!token){details.textContent='Der Bestätigungslink fehlt.'}else{fetch(API+'/booking-confirm?token='+encodeURIComponent(token)).then(r=>r.ok?r.json():r.json().then(x=>Promise.reject(x))).then(x=>{details.innerHTML='<strong>Vorgang '+x.reference+'</strong><br>'+[x.cruise_line,x.ship,x.route].filter(Boolean).join(' · ');button.disabled=false}).catch(e=>details.textContent=e.error||'Dieser Link ist ungültig oder abgelaufen.')}button.addEventListener('click',()=>{button.disabled=true;message.textContent='Bestätigung wird übermittelt …';fetch(API+'/booking-confirm?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.ok?r.json():r.json().then(x=>Promise.reject(x))).then(x=>{message.textContent='Vielen Dank. Deine Bestätigung ist eingegangen. Die nächsten Schritte erhältst du per E-Mail.'}).catch(e=>{message.textContent=e.error||'Die Bestätigung konnte nicht übermittelt werden.';button.disabled=false})});</script></body></html>
